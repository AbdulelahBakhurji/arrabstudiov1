name: Desktop release

on:
  workflow_dispatch:
    inputs:
      universal_mac:
        description: "Build universal macOS binary (Intel + Apple Silicon)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Least privilege: only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (.app + .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Install & package
        env:
          VITE_ARRAB_API_URL: https://api.arrabai.com
          VITE_ARRAB_API_ROUTE_PREFIX: /r/nmpi6uidtpkh1bdf
          ARRAB_UNIVERSAL: ${{ inputs.universal_mac && '1' || '0' }}
          # Developer ID signing + notarization (set these repository secrets before tagging a release).
          # Without them the build is unsigned and the in-app installer refuses to run (by design).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # minisign key for the signed updater (latest.json + .sig artifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm ship:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrab-studio-macos
          path: |
            release/artifacts/**
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  windows:
    name: Windows (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Install & package
        env:
          VITE_ARRAB_API_URL: https://api.arrabai.com
          VITE_ARRAB_API_ROUTE_PREFIX: /r/nmpi6uidtpkh1bdf
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm ship:windows
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrab-studio-windows
          path: |
            release/artifacts/**
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  publish:
    name: GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: arrab-studio-macos
          path: dist/macos
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: arrab-studio-windows
          path: dist/windows
      - name: Collect release files
        run: |
          mkdir -p release-upload
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.app.tar.gz' \) -print -exec cp {} release-upload/ \;
          ls -la release-upload || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Arrab Studio ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
