name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an older run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: arrab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Format (files changed in this change only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- '*.ts' '*.tsx' '*.json' '*.md' '*.yml' | tr '\n' ' ')
          [ -z "$files" ] || pnpm exec prettier --check $files
      - name: Tests (includes Postgres integration)
        env:
          ARRAB_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/arrab
        run: pnpm test
      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Real-browser end-to-end
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Shells, roles, plans, offline, RTL, keyboard
        env:
          ARRAB_E2E: "1"
          ARRAB_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm vitest run tests/e2e

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # The Tauri build script needs the frontend output directory to exist.
      - run: mkdir -p ../dist
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked

  supply-chain:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri
