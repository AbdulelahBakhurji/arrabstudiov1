[package]
name = "arrab-studio"
version = "0.1.0"
description = "Arrab Studio"
authors = ["Arrab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arrab_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
